<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tour Estimate Management System</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
  <div id="app" class="container mx-auto p-6 max-w-7xl">
    <!-- Loading State -->
    <div id="loading" class="flex items-center justify-center min-h-screen">
      <div class="text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
        <p class="text-xl text-gray-700">Loading...</p>
      </div>
    </div>

    <!-- Main App (hidden initially) -->
    <div id="mainApp" class="hidden">
      <!-- Database Status Banner -->
      <div class="bg-gradient-to-r from-green-500 to-emerald-600 text-white rounded-xl shadow-lg p-4 mb-6">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <i data-lucide="database" class="w-6 h-6"></i>
            <div>
              <div class="font-bold">🌐 Connected to Supabase Database</div>
              <div class="text-sm opacity-90">All changes are synced in real-time</div>
            </div>
          </div>
          <button onclick="loadEstimates()" class="bg-white text-green-700 px-4 py-2 rounded-lg hover:bg-green-50 transition font-medium">
            <i data-lucide="refresh-cw" class="w-4 h-4 inline mr-2"></i>
            Refresh
          </button>
        </div>
      </div>

      <!-- Header -->
      <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
          <div>
            <h1 class="text-4xl font-bold text-gray-800 mb-2">Tour Estimate Management</h1>
            <p class="text-gray-600">Track and analyze your tour estimates</p>
          </div>
          <div class="flex flex-wrap gap-2">
            <button onclick="addEstimate()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition shadow-md">
              <i data-lucide="plus" class="w-5 h-5 inline mr-2"></i>
              Add New
            </button>
            <button onclick="exportToCSV()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition shadow-md">
              <i data-lucide="download" class="w-5 h-5 inline mr-2"></i>
              Export CSV
            </button>
          </div>
        </div>

        <!-- View Switcher -->
        <div class="flex gap-2 mb-4">
          <button onclick="switchView('table')" id="btnTableView" class="px-4 py-2 rounded-lg transition bg-blue-600 text-white">
            Table View
          </button>
          <button onclick="switchView('analytics')" id="btnAnalyticsView" class="px-4 py-2 rounded-lg transition bg-gray-200 text-gray-700 hover:bg-gray-300">
            Analytics View
          </button>
        </div>

        <!-- Stats Cards -->
        <div id="statsCards" class="grid grid-cols-2 md:grid-cols-5 gap-4">
          <!-- Stats will be inserted here -->
        </div>
      </div>

      <!-- Table View -->
      <div id="tableView">
        <!-- Filters -->
        <div class="bg-white rounded-xl shadow-lg p-4 mb-6">
          <div class="flex flex-wrap gap-4">
            <select id="filterCountry" onchange="applyFilters()" class="border border-gray-300 rounded-lg px-4 py-2">
              <option value="All">Country: All</option>
              <option value="Taiwan">Taiwan</option>
              <option value="Singapore">Singapore</option>
              <option value="Vietnam">Vietnam</option>
              <option value="Japan">Japan</option>
              <option value="Thailand">Thailand</option>
            </select>
            <select id="filterStatus" onchange="applyFilters()" class="border border-gray-300 rounded-lg px-4 py-2">
              <option value="All">Status: All</option>
              <option value="Estimating">Estimating</option>
              <option value="Under Review">Under Review</option>
              <option value="Won">Won</option>
              <option value="Lost">Lost</option>
              <option value="On Hold">On Hold</option>
            </select>
          </div>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white">
                <tr>
                  <th class="px-4 py-3 text-left text-sm font-semibold">Date</th>
                  <th class="px-4 py-3 text-left text-sm font-semibold">Country</th>
                  <th class="px-4 py-3 text-left text-sm font-semibold">Client Name</th>
                  <th class="px-4 py-3 text-left text-sm font-semibold">Tour Name</th>
                  <th class="px-4 py-3 text-left text-sm font-semibold">Status</th>
                  <th class="px-4 py-3 text-left text-sm font-semibold">Follow-up Date</th>
                  <th class="px-4 py-3 text-left text-sm font-semibold">Lost Reason</th>
                  <th class="px-4 py-3 text-left text-sm font-semibold">Notes</th>
                  <th class="px-4 py-3 text-left text-sm font-semibold">Action</th>
                </tr>
              </thead>
              <tbody id="estimatesTable">
                <!-- Rows will be inserted here -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Analytics View -->
      <div id="analyticsView" class="hidden space-y-6">
        <!-- Charts Row 1 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Country Distribution -->
          <div class="bg-white rounded-xl shadow-lg p-6">
            <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
              <i data-lucide="pie-chart" class="w-6 h-6 text-blue-600"></i>
              Estimates by Country
            </h3>
            <div class="h-80">
              <canvas id="countryChart"></canvas>
            </div>
          </div>

          <!-- Status Distribution -->
          <div class="bg-white rounded-xl shadow-lg p-6">
            <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
              <i data-lucide="bar-chart-3" class="w-6 h-6 text-green-600"></i>
              Estimates by Status
            </h3>
            <div class="h-80">
              <canvas id="statusChart"></canvas>
            </div>
          </div>
        </div>

        <!-- Monthly Trend -->
        <div class="bg-white rounded-xl shadow-lg p-6">
          <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
            <i data-lucide="trending-up" class="w-6 h-6 text-purple-600"></i>
            Monthly Trend Analysis
          </h3>
          <div class="h-96">
            <canvas id="trendChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // 🔧 CONFIGURATION - REPLACE WITH YOUR VALUES
    // ============================================
    const SUPABASE_URL = 'https://vvfjmsxxgawricefgtqg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2Zmptc3h4Z2F3cmljZWZndHFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEzODgxNDIsImV4cCI6MjA3Njk2NDE0Mn0.dLb8XFs4eZ4rsYe49akXwANhHIIeRleoKspvPLADE1w';
    
    // Initialize Supabase client
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // Global variables
    let allEstimates = [];
    let filteredEstimates = [];
    let currentView = 'table';
    let charts = {
      country: null,
      status: null,
      trend: null
    };
    
    const countries = ['Taiwan', 'Singapore', 'Vietnam', 'Japan', 'Thailand'];
    const statuses = ['Estimating', 'Under Review', 'Won', 'Lost', 'On Hold'];
    const lostReasons = [
      'Pricing - Too expensive',
      'Pricing - Competitor offered lower',
      'Service - Itinerary not suitable',
      'Service - Dates not available',
      'Budget - Client budget cut',
      'Timing - Wrong season',
      'Competition - Chose another vendor',
      'Quality - Service concerns',
      'Communication - Response time',
      'Other - Please specify in notes'
    ];

    // ============================================
    // VIEW MANAGEMENT
    // ============================================
    
    function switchView(view) {
      currentView = view;
      
      if (view === 'table') {
        document.getElementById('tableView').classList.remove('hidden');
        document.getElementById('analyticsView').classList.add('hidden');
        document.getElementById('btnTableView').className = 'px-4 py-2 rounded-lg transition bg-blue-600 text-white';
        document.getElementById('btnAnalyticsView').className = 'px-4 py-2 rounded-lg transition bg-gray-200 text-gray-700 hover:bg-gray-300';
      } else {
        document.getElementById('tableView').classList.add('hidden');
        document.getElementById('analyticsView').classList.remove('hidden');
        document.getElementById('btnTableView').className = 'px-4 py-2 rounded-lg transition bg-gray-200 text-gray-700 hover:bg-gray-300';
        document.getElementById('btnAnalyticsView').className = 'px-4 py-2 rounded-lg transition bg-blue-600 text-white';
        updateCharts();
      }
    }

    // ============================================
    // DATABASE OPERATIONS
    // ============================================
    
    async function loadEstimates() {
      try {
        const { data, error } = await supabase
          .from('estimates')
          .select('*')
          .order('created_at', { ascending: false });
        
        if (error) throw error;
        
        allEstimates = data || [];
        applyFilters();
        updateStats();
        if (currentView === 'analytics') {
          updateCharts();
        }
      } catch (error) {
        console.error('Error loading estimates:', error);
        alert('Error loading data: ' + error.message);
      }
    }

    async function addEstimate() {
      try {
        const newEstimate = {
          date: new Date().toISOString().split('T')[0],
          country: 'Taiwan',
          client_name: '',
          tour_name: '',
          status: 'Estimating',
          follow_up_date: null,
          reason: '',
          note: ''
        };
        
        const { data, error } = await supabase
          .from('estimates')
          .insert([newEstimate])
          .select();
        
        if (error) throw error;
        
        await loadEstimates();
      } catch (error) {
        console.error('Error adding estimate:', error);
        alert('Error adding estimate: ' + error.message);
      }
    }

    async function updateEstimate(id, field, value) {
      try {
        const updateData = {};
        updateData[field] = value || null;
        
        const { error } = await supabase
          .from('estimates')
          .update(updateData)
          .eq('id', id);
        
        if (error) throw error;
        
        // Update local data
        const estimate = allEstimates.find(e => e.id === id);
        if (estimate) {
          estimate[field] = value;
          applyFilters();
          updateStats();
        }
      } catch (error) {
        console.error('Error updating estimate:', error);
        alert('Error updating estimate: ' + error.message);
      }
    }

    async function deleteEstimate(id) {
      if (!confirm('Are you sure you want to delete this estimate?')) return;
      
      try {
        const { error } = await supabase
          .from('estimates')
          .delete()
          .eq('id', id);
        
        if (error) throw error;
        
        await loadEstimates();
      } catch (error) {
        console.error('Error deleting estimate:', error);
        alert('Error deleting estimate: ' + error.message);
      }
    }

    // ============================================
    // UI OPERATIONS
    // ============================================
    
    function applyFilters() {
      const countryFilter = document.getElementById('filterCountry').value;
      const statusFilter = document.getElementById('filterStatus').value;
      
      filteredEstimates = allEstimates.filter(e => {
        const countryMatch = countryFilter === 'All' || e.country === countryFilter;
        const statusMatch = statusFilter === 'All' || e.status === statusFilter;
        return countryMatch && statusMatch;
      });
      
      renderTable();
      updateStats();
    }

    function renderTable() {
      const tbody = document.getElementById('estimatesTable');
      
      if (filteredEstimates.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="text-center py-8 text-gray-500">No estimates found. Click "Add New" to create one.</td></tr>';
        return;
      }
      
      tbody.innerHTML = filteredEstimates.map(estimate => `
        <tr class="border-b hover:bg-blue-50 transition">
          <td class="px-4 py-3">
            <input type="date" value="${estimate.date || ''}" 
              onchange="updateEstimate(${estimate.id}, 'date', this.value)"
              class="border rounded-lg px-2 py-1 text-sm w-full">
          </td>
          <td class="px-4 py-3">
            <select onchange="updateEstimate(${estimate.id}, 'country', this.value)"
              class="border rounded-lg px-2 py-1 text-sm w-full">
              ${countries.map(c => `<option value="${c}" ${estimate.country === c ? 'selected' : ''}>${c}</option>`).join('')}
            </select>
          </td>
          <td class="px-4 py-3">
            <input type="text" value="${estimate.client_name || ''}" 
              onchange="updateEstimate(${estimate.id}, 'client_name', this.value)"
              class="border rounded-lg px-2 py-1 text-sm w-full" placeholder="Client name">
          </td>
          <td class="px-4 py-3">
            <input type="text" value="${estimate.tour_name || ''}" 
              onchange="updateEstimate(${estimate.id}, 'tour_name', this.value)"
              class="border rounded-lg px-2 py-1 text-sm w-full" placeholder="Tour name">
          </td>
          <td class="px-4 py-3">
            <select onchange="updateEstimate(${estimate.id}, 'status', this.value)"
              class="border rounded-lg px-2 py-1 text-sm w-full font-medium ${getStatusColor(estimate.status)}">
              ${statuses.map(s => `<option value="${s}" ${estimate.status === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
          </td>
          <td class="px-4 py-3">
            <input type="date" value="${estimate.follow_up_date || ''}" 
              onchange="updateEstimate(${estimate.id}, 'follow_up_date', this.value)"
              class="border rounded-lg px-2 py-1 text-sm w-full">
          </td>
          <td class="px-4 py-3">
            <select onchange="updateEstimate(${estimate.id}, 'reason', this.value)"
              class="border rounded-lg px-2 py-1 text-sm w-full" ${estimate.status !== 'Lost' ? 'disabled' : ''}>
              <option value="">Select reason...</option>
              ${lostReasons.map(r => `<option value="${r}" ${estimate.reason === r ? 'selected' : ''}>${r}</option>`).join('')}
            </select>
          </td>
          <td class="px-4 py-3">
            <input type="text" value="${estimate.note || ''}" 
              onchange="updateEstimate(${estimate.id}, 'note', this.value)"
              class="border rounded-lg px-2 py-1 text-sm w-full" placeholder="Notes">
          </td>
          <td class="px-4 py-3">
            <button onclick="deleteEstimate(${estimate.id})"
              class="text-red-600 hover:text-red-800 hover:bg-red-50 p-2 rounded transition">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </td>
        </tr>
      `).join('');
      
      lucide.createIcons();
    }

    function getStatusColor(status) {
      switch(status) {
        case 'Won': return 'bg-green-50 text-green-700';
        case 'Lost': return 'bg-red-50 text-red-700';
        case 'Under Review': return 'bg-yellow-50 text-yellow-700';
        default: return 'bg-gray-50 text-gray-700';
      }
    }

    function updateStats() {
      const total = filteredEstimates.length;
      const won = filteredEstimates.filter(e => e.status === 'Won').length;
      const lost = filteredEstimates.filter(e => e.status === 'Lost').length;
      const pending = filteredEstimates.filter(e => ['Estimating', 'Under Review', 'On Hold'].includes(e.status)).length;
      const winRate = total > 0 ? ((won / total) * 100).toFixed(1) : 0;
      
      document.getElementById('statsCards').innerHTML = `
        <div class="bg-gradient-to-br from-blue-500 to-blue-600 text-white p-4 rounded-lg shadow-md">
          <div class="text-sm opacity-90">Total Estimates</div>
          <div class="text-3xl font-bold">${total}</div>
        </div>
        <div class="bg-gradient-to-br from-green-500 to-green-600 text-white p-4 rounded-lg shadow-md">
          <div class="text-sm opacity-90">Won</div>
          <div class="text-3xl font-bold">${won}</div>
        </div>
        <div class="bg-gradient-to-br from-red-500 to-red-600 text-white p-4 rounded-lg shadow-md">
          <div class="text-sm opacity-90">Lost</div>
          <div class="text-3xl font-bold">${lost}</div>
        </div>
        <div class="bg-gradient-to-br from-yellow-500 to-yellow-600 text-white p-4 rounded-lg shadow-md">
          <div class="text-sm opacity-90">Pending</div>
          <div class="text-3xl font-bold">${pending}</div>
        </div>
        <div class="bg-gradient-to-br from-purple-500 to-purple-600 text-white p-4 rounded-lg shadow-md">
          <div class="text-sm opacity-90">Win Rate</div>
          <div class="text-3xl font-bold">${winRate}%</div>
        </div>
      `;
    }

    // ============================================
    // CHARTS
    // ============================================
    
    function updateCharts() {
      updateCountryChart();
      updateStatusChart();
      updateTrendChart();
      lucide.createIcons();
    }

    function updateCountryChart() {
      const countryData = {};
      allEstimates.forEach(e => {
        countryData[e.country] = (countryData[e.country] || 0) + 1;
      });
      
      const data = {
        labels: Object.keys(countryData),
        datasets: [{
          data: Object.values(countryData),
          backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6']
        }]
      };
      
      if (charts.country) {
        charts.country.destroy();
      }
      
      const ctx = document.getElementById('countryChart').getContext('2d');
      charts.country = new Chart(ctx, {
        type: 'pie',
        data: data,
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom'
            }
          }
        }
      });
    }

    function updateStatusChart() {
      const statusData = {};
      allEstimates.forEach(e => {
        statusData[e.status] = (statusData[e.status] || 0) + 1;
      });
      
      const data = {
        labels: Object.keys(statusData),
        datasets: [{
          label: 'Number of Estimates',
          data: Object.values(statusData),
          backgroundColor: '#10b981'
        }]
      };
      
      if (charts.status) {
        charts.status.destroy();
      }
      
      const ctx = document.getElementById('statusChart').getContext('2d');
      charts.status = new Chart(ctx, {
        type: 'bar',
        data: data,
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                stepSize: 1
              }
            }
          }
        }
      });
    }

    function updateTrendChart() {
      const monthlyData = {};
      allEstimates.forEach(e => {
        const month = e.date.substring(0, 7);
        if (!monthlyData[month]) {
          monthlyData[month] = { total: 0, won: 0, lost: 0 };
        }
        monthlyData[month].total++;
        if (e.status === 'Won') monthlyData[month].won++;
        if (e.status === 'Lost') monthlyData[month].lost++;
      });
      
      const sortedMonths = Object.keys(monthlyData).sort();
      
      const data = {
        labels: sortedMonths,
        datasets: [
          {
            label: 'Total',
            data: sortedMonths.map(m => monthlyData[m].total),
            borderColor: '#3b82f6',
            backgroundColor: 'rgba(59, 130, 246, 0.1)',
            tension: 0.4
          },
          {
            label: 'Won',
            data: sortedMonths.map(m => monthlyData[m].won),
            borderColor: '#10b981',
            backgroundColor: 'rgba(16, 185, 129, 0.1)',
            tension: 0.4
          },
          {
            label: 'Lost',
            data: sortedMonths.map(m => monthlyData[m].lost),
            borderColor: '#ef4444',
            backgroundColor: 'rgba(239, 68, 68, 0.1)',
            tension: 0.4
          }
        ]
      };
      
      if (charts.trend) {
        charts.trend.destroy();
      }
      
      const ctx = document.getElementById('trendChart').getContext('2d');
      charts.trend = new Chart(ctx, {
        type: 'line',
        data: data,
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom'
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                stepSize: 1
              }
            }
          }
        }
      });
    }

    function exportToCSV() {
      const headers = ['Date', 'Country', 'Client Name', 'Tour Name', 'Status', 'Follow-up Date', 'Lost Reason', 'Notes'];
      const rows = allEstimates.map(e => [
        e.date,
        e.country,
        e.client_name,
        e.tour_name,
        e.status,
        e.follow_up_date || '',
        e.reason || '',
        e.note || ''
      ]);
      
      const csvContent = [
        headers.join(','),
        ...rows.map(row => row.map(cell => `"${cell}"`).join(','))
      ].join('\n');
      
      const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `tour_estimates_${new Date().toISOString().split('T')[0]}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    // ============================================
    // INITIALIZATION
    // ============================================
    
    async function init() {
      try {
        // Check if Supabase is configured
        if (SUPABASE_URL === 'YOUR_SUPABASE_PROJECT_URL' || SUPABASE_ANON_KEY === 'YOUR_SUPABASE_ANON_KEY') {
          alert('Please configure your Supabase credentials in the HTML file!');
          return;
        }
        
        // Load data
        await loadEstimates();
        
        // Hide loading, show app
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        
        // Initialize Lucide icons
        lucide.createIcons();
      } catch (error) {
        console.error('Initialization error:', error);
        alert('Failed to initialize app: ' + error.message);
      }
    }

    // Start the app when DOM is ready
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
